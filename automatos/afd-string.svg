<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">AFD: string</text>

  <!-- entrada -->
  <line x1="20" y1="190" x2="50" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- estados normais -->
  <circle cx="84" cy="190" r="34" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="84" y="195" text-anchor="middle" font-size="13" fill="#222">START</text>

  <circle cx="330" cy="190" r="46" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="330" y="195" text-anchor="middle" font-size="13" fill="#222">IN_STRING</text>

  <circle cx="770" cy="190" r="48" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="770" cy="190" r="42" fill="none" stroke="#333" stroke-width="2"/>
  <text x="770" y="195" text-anchor="middle" font-size="13" fill="#222">FIM_STRING</text>

  <circle cx="330" cy="380" r="46" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="330" y="385" text-anchor="middle" font-size="13" fill="#222">IN_ESCAPE</text>

  <!-- estados de erro -->
  <rect x="470" y="50" width="200" height="50" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="570" y="80" text-anchor="middle" font-size="13" fill="#b3261e">ERRO_NAO_FECHADA</text>

  <rect x="560" y="355" width="190" height="50" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="655" y="385" text-anchor="middle" font-size="13" fill="#b3261e">ERRO_ESCAPE</text>

  <!-- START -> IN_STRING -->
  <line x1="118" y1="190" x2="284" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="201" y="180" text-anchor="middle" font-size="14" fill="#222">"</text>
  <text x="201" y="208" text-anchor="middle" font-size="12" fill="#555">advance()</text>

  <!-- laço IN_STRING -->
  <path d="M 308 150 C 280 80, 380 80, 352 150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="70" text-anchor="middle" font-size="12" fill="#222">qualquer exceto  "  \  \n  EOF</text>
  <text x="330" y="88" text-anchor="middle" font-size="12" fill="#555">advance()</text>

  <!-- IN_STRING -> FIM_STRING -->
  <line x1="376" y1="190" x2="722" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="549" y="180" text-anchor="middle" font-size="14" fill="#222">"  (aspa de fechamento)</text>
  <text x="549" y="208" text-anchor="middle" font-size="12" fill="#555">advance()</text>

  <!-- IN_STRING -> ERRO_NAO_FECHADA -->
  <line x1="366" y1="162" x2="480" y2="102" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#e)"/>
  <text x="440" y="150" font-size="12" fill="#b3261e">\n | EOF</text>

  <!-- IN_STRING -> IN_ESCAPE (descida) -->
  <line x1="310" y1="232" x2="310" y2="336" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="298" y="290" text-anchor="end" font-size="14" fill="#222">\</text>
  <text x="298" y="308" text-anchor="end" font-size="12" fill="#555">advance()</text>

  <!-- IN_ESCAPE -> IN_STRING (subida) -->
  <line x1="350" y1="336" x2="350" y2="232" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="362" y="285" font-size="13" fill="#222">"  \  n  t</text>
  <text x="362" y="303" font-size="12" fill="#555">advance()</text>

  <!-- IN_ESCAPE -> ERRO_ESCAPE -->
  <line x1="376" y1="380" x2="550" y2="380" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#e)"/>
  <text x="463" y="370" text-anchor="middle" font-size="12" fill="#b3261e">outro | EOF</text>

  <!-- legenda -->
  <rect x="40" y="430" width="820" height="38" rx="8" fill="#f4f6f8" stroke="#999"/>
  <text x="56" y="453" font-size="12" fill="#222">Círculo duplo = estado final. Retângulo tracejado = erro léxico: reporta linha/coluna e o scanner continua (ERRO_ESCAPE volta a IN_STRING).</text>
</svg>
